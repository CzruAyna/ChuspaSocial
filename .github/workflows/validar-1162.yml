name: Validacion Moodle de etiquetas 1162

on:
  push:
    branches: [codex/validar-1162]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  moodle:
    name: Moodle 4.5 - ${{ matrix.version }} - ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB: ${{ matrix.database }}
      DB_USER: ${{ matrix.db_user }}
    strategy:
      fail-fast: false
      matrix:
        version: [base, feature]
        database: [mariadb, pgsql]
        include:
          - version: base
            revision: 'cd7ce4ea7613cc012cc01146f4e44227745d2dd5'
          - version: feature
            revision: 'aaa18a12ccd14340836c42e01cee76b19e781468'
          - database: mariadb
            db_user: root
          - database: pgsql
            db_user: postgres
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: moodle
          MYSQL_DATABASE: moodle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Obtener el commit exacto
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
          path: plugin
          persist-credentials: false
      - name: Obtener la misma revision de Moodle probada en Windows
        uses: actions/checkout@v7
        with:
          repository: moodle/moodle
          ref: c0690bbc765fccacd4956452cbff3f6aacad77c5
          path: moodle
          persist-credentials: false
      - name: PHP 8.1 como el CI del proyecto
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pgsql, mysqli, intl, mbstring, xml, zip, gd, curl, soap
          coverage: none
          ini-values: max_input_vars=5000
      - name: Preparar Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci '^4'
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
      - name: Generar la configuracion regional requerida por PHPUnit
        run: |
          sudo locale-gen en_AU.UTF-8
          locale -a | grep -ix 'en_AU.utf8'
      - name: Instalar Moodle y el plugin con base real
        id: install_moodle
        run: |
          mkdir -p "$RUNNER_TEMP/moodle-data" "$RUNNER_TEMP/moodle-phpunit"
          mkdir -p moodle/local/chuspasocial
          cp -a plugin/src/. moodle/local/chuspasocial/
          cat > moodle/config.php <<'PHP'
          <?php
          $CFG = new stdClass();
          $CFG->dbtype = getenv('DB');
          $CFG->dblibrary = 'native';
          $CFG->dbhost = '127.0.0.1';
          $CFG->dbname = 'moodle';
          $CFG->dbuser = getenv('DB_USER');
          $CFG->dbpass = 'moodle';
          $CFG->prefix = 'mdl_';
          $CFG->dboptions = ['dbpersist' => false, 'dbport' => '', 'dbsocket' => ''];
          $CFG->wwwroot = 'http://localhost';
          $CFG->dataroot = getenv('RUNNER_TEMP') . '/moodle-data';
          $CFG->phpunit_prefix = 'phpu_';
          $CFG->phpunit_dataroot = getenv('RUNNER_TEMP') . '/moodle-phpunit';
          $CFG->admin = 'admin';
          require_once __DIR__ . '/lib/setup.php';
          PHP
          cd moodle
          php admin/tool/phpunit/cli/init.php --no-composer-self-update 2>&1 | tee ../init-results.log || {
            summary=$(tail -15 ../init-results.log | tr '\n' ' ' | sed 's/%/%25/g')
            printf '::error title=Inicializacion de Moodle::%s\n' "$summary"
            exit 1
          }
      - name: Sintaxis PHP del archivo de la issue
        run: php -l plugin/src/tests/local/post_tags_test.php
      - name: PHPCS sin warnings en el archivo modificado
        if: ${{ matrix.version == 'feature' }}
        run: phpcs --standard=moodle --warning-severity=1 plugin/src/tests/local/post_tags_test.php
      - name: Ejecutar el archivo de etiquetas en Moodle
        if: ${{ !cancelled() && steps.install_moodle.outcome == 'success' }}
        working-directory: moodle
        run: |
          php vendor/phpunit/phpunit/phpunit --colors=never --testdox --fail-on-warning --log-junit ../tags-results.xml local/chuspasocial/tests/local/post_tags_test.php 2>&1 | tee ../tags-results.log || {
            summary=$(tail -20 ../tags-results.log | tr '\n' ' ' | sed 's/%/%25/g')
            printf '::error title=PHPUnit de etiquetas::%s\n' "$summary"
            exit 1
          }
      - name: Ejecutar la suite completa del plugin
        if: ${{ !cancelled() && steps.install_moodle.outcome == 'success' }}
        working-directory: moodle
        run: |
          php vendor/phpunit/phpunit/phpunit --colors=never --fail-on-warning --log-junit ../suite-results.xml --testsuite local_chuspasocial_testsuite 2>&1 | tee ../suite-results.log || {
            summary=$(tail -20 ../suite-results.log | tr '\n' ' ' | sed 's/%/%25/g')
            printf '::error title=Suite del plugin::%s\n' "$summary"
            exit 1
          }
      - name: Resumen de resultados
        if: always()
        run: |
          for result in init-results.log tags-results.log suite-results.log; do
            if [ -f "$result" ]; then
              printf '### %s\n\n```text\n' "$result" >> "$GITHUB_STEP_SUMMARY"
              tail -30 "$result" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in ('tags-results.xml', 'suite-results.xml'):
              if not Path(report).is_file():
                  continue
              root = ET.parse(report).getroot()
              cases = root.findall('.//testcase')
              failed = [case.attrib['name'] for case in cases
                        if case.find('error') is not None or case.find('failure') is not None]
              skipped = sum(case.find('skipped') is not None for case in cases)
              assertions = sum(int(case.attrib.get('assertions', 0)) for case in cases)
              print(f'::notice title={report}::{len(cases)} tests, {assertions} assertions, '
                    f'{len(failed)} failed, {skipped} skipped')
              if failed:
                  print('::warning title=Pruebas fallidas::' + ', '.join(failed[:20]))
          PY
      - name: Guardar informes PHPUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moodle-${{ matrix.version }}-${{ matrix.database }}
          path: |
            *-results.xml
            *-results.log
          if-no-files-found: warn
